name: Update VU timetable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "ics/**"
      - "config.json"
  schedule:
    # 00:30 UTC is 06:00 in Sri Lanka.
    - cron: "30 0 * * *"

jobs:
  update_calendars:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Download live timetable
        env:
          CAL_LINK: ${{ secrets.CAL_LINK }}
        run: npm run download

      - run: npm run generate

      - name: Commit calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ics config.json
          if git diff --staged --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Update degree calendars"
            git push
          fi
