name: Update timetables

on:
  workflow_dispatch:
  push:
    branches:
      - vu-25.3-year-2-cyber-security
      - soc-26.3-year-1-semester-1
    paths-ignore:
      - "ics/**"
      - "config.json"
  schedule:
    # 06:00, 12:00, 18:00 and 00:00 in Sri Lanka.
    - cron: "30 */6 * * *"

jobs:
  update_calendars:
    name: Update ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [vu-25.3-year-2-cyber-security, soc-26.3-year-1-semester-1]
    concurrency:
      group: timetable-update-${{ matrix.branch }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Download live timetable
        env:
          CAL_LINK: ${{ matrix.branch == 'vu-25.3-year-2-cyber-security' && secrets.CAL_LINK || matrix.branch == 'soc-26.3-year-1-semester-1' && vars.SOC_26_3_CAL_LINK || '' }}
        run: npm run download

      - run: npm run generate

      - name: Commit calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ics config.json
          if git diff --staged --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Update degree calendars"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
